<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Callzone Management</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header id="setup" class="setup">
  <h1>Callzone Management</h1>
  <div class="setup-row">
    <label>
      Event ID
      <input id="eventId" type="text" inputmode="numeric" placeholder="e.g. 2101" />
    </label>
    <label>
      Server
      <select id="host">
        <option value="prod">dav.results.info</option>
        <option value="ifsc">ifsc.results.info</option>
        <option value="stage">dav-stage.results.info (test)</option>
      </select>
    </label>
    <button id="loadEvent">Load event</button>
  </div>
  <div id="setupError" class="error" hidden></div>

  <div id="categoryRow" class="setup-row" hidden>
    <label class="grow">
      Category / round
      <select id="roundSelect"></select>
    </label>
    <button id="watchRound">Show</button>
  </div>
</header>

<main id="board" class="board" hidden>
  <div class="board-topbar">
    <button id="backBtn" class="ghost">&larr; switch round</button>
    <div id="roundTitle" class="round-title"></div>
    <button id="kioskBtn" class="ghost">Fullscreen + Always On</button>
    <div id="statusLine" class="status-line"></div>
  </div>
  <div id="shareRow" class="share-row">
    <span class="share-label">Link for this tablet:</span>
    <input id="shareLink" class="share-input" type="text" readonly />
    <button id="copyLink" class="ghost">Copy</button>
  </div>
  <div id="groupTabs" class="group-tabs" hidden></div>
  <div id="lanes" class="lanes"></div>
</main>

<script src="app.js"></script>
</body>
</html>
